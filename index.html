<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Event Invitation</title>

    <link rel="stylesheet" href="index.css/normalize.css">
    <link rel="stylesheet" href="index.css/style.css">
</head>

<body>
    <main class="card animate__animated animate__fadeInUp">
    <img src="images/envelope.svg" alt="A closed light gray envelope with a darker gray triangular flap, presented as a decorative invitation symbol on the developer event invitation card.">
        <h1>You're Invited!</h1>
        <p>Join us for an evening of Front-end coding, coffee, and networking!</p>
        <div class="star-container">
            <svg class="floating-star" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="50" height="50">
                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="#f39c12" />
            </svg>
        </div>

        <button class="rsvp-btn">Count Me In!</button>

    </main>

</body>
</html>
